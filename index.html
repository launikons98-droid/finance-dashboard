<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Витаутас — Финансовый дашборд v2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="welcome-screen">
        <h2>📊 Добро пожаловать в Финансовый дашборд</h2>
        <p id="welcome-message">Выберите файл данных, чтобы начать работу.<br>Если вы уже работали с файлом, нажмите «Подключить сохранённый файл».</p>
        <div id="welcome-buttons">
            <button id="reconnect-btn" style="display: none;">🔗 Подключить сохранённый файл</button>
            <button id="pick-file-btn">📂 Выбрать существующий файл</button>
            <button id="create-file-btn">✨ Создать новый файл</button>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <div class="container">
            <h1>📊 Финансовый дашборд</h1>
            <p class="subtitle">Витаутас · Данные хранятся в выбранном файле</p>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('salary')">💵 Зарплата</button>
                <button class="tab-btn" onclick="switchTab('sidejobs')">🔧 Подработки</button>
                <button class="tab-btn" onclick="switchTab('debts')">💳 Долги</button>
                <button class="tab-btn" onclick="switchTab('plan')">📅 План трат</button>
                <button class="tab-btn" onclick="switchTab('savings')">🏦 Накопления</button>
                <button class="tab-btn" onclick="switchTab('summary')">📊 Сводная</button>
            </div>

            <div id="tab-salary" class="tab-content active"></div>
            <div id="tab-sidejobs" class="tab-content"></div>
            <div id="tab-debts" class="tab-content"></div>
            <div id="tab-plan" class="tab-content"></div>
            <div id="tab-savings" class="tab-content"></div>
            <div id="tab-summary" class="tab-content"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <h2 id="modal-title">Редактирование</h2>
            <div id="modal-fields"></div>
            <div class="modal-actions">
                <button class="danger" id="modal-delete-btn" style="display:none;">🗑️ Удалить</button>
                <button class="secondary" onclick="closeModal()">Отмена</button>
                <button onclick="saveModal()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/salary.js"></script>
    <script src="js/sidejobs.js"></script>
    <script src="js/debts.js"></script>
    <script src="js/plan.js"></script>
    <script src="js/savings.js"></script>
    <script src="js/summary.js"></script>
</body>
</html>
